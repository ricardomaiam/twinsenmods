nome = Pilot ships and vehicles
descricao = Near a ship press V to get in/out. Arrows, A/D and E/Q to fly. Banks on turns; ride the Dino-Fly. The Esmer ship lights up, fires its exhaust and goes to space.
nome_en = Pilot ships and vehicles
descricao_en = Near a ship press V to get in/out. Arrows, A/D and E/Q to fly. Banks on turns; ride the Dino-Fly. The Esmer ship lights up, fires its exhaust and goes to space.
nome_pt = Pilotar naves e veículos
descricao_pt = Perto de uma nave aperte V para entrar/sair. Setas, A/D e E/Q para voar. Inclina nas curvas; dá para montar no Dino-Fly. A nave Esmer acende as luzes, solta fogo pelo escapamento e vai ao espaço.
motor = pilot
autor = Ricardo & Claude
versao = 1.3
