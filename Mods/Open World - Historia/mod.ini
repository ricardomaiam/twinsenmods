nome_pt = Mundo Aberto: liberar pela história (adicional)
descricao_pt = Use junto com o Mundo Aberto. As ilhas e os mundos só abrem conforme você avança na história: uma cúpula transparente sobre a ilha (ou uma camada em volta do planeta) bloqueia os que você ainda não alcançou.
