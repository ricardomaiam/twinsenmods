nome = Open World (one map per planet)
descricao = Twinsun, Zeelich and the under-gas world each become one big map: swim, fly or pilot from any island to any other. Climb high with the Esmer ship to reach space and fly to another world. Mini holomap in the lower-left corner. No saving at open sea.
