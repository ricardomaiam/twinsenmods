nome_pt = Mundo Aberto (um mapa por planeta)
descricao_pt = Twinsun, Zeelich e o mundo sob o gás viram cada um um mapa só: nade, voe ou pilote de qualquer ilha para outra. Suba bem alto com a nave Esmer para chegar ao espaço e voar para outro mundo. Mini holomapa no canto inferior esquerdo. Não dá para salvar em mar aberto.
